spring:
  application:
    name: back_office_service

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/back_office_db?stringtype=unspecified
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  port: 9100

app:
  kafka-url:
    ${KAFKA_HOST}:${KAFKA_PORT}

